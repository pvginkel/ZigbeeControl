# Curated automation for the ZigbeeControl monorepo — what `kc project setup |
# build | test | lint` runs, and the AI workflow's merge gate.
#
# Everything needing a language toolchain is `cexec modern-app`-prefixed: the dev
# container carries neither uv nor pnpm. None of these lines is called by CI —
# Jenkins runs the same two suites through `uv run --no-sync run-suite`
# (tools/suite_runner) — so the prefixes are safe here.
#
# Neither Dockerfile is wired into `build:`. Both images are CI's
# (helmCharts.kaniko2 in the Jenkinsfile) and this environment has no image builder,
# so there is nothing to build locally.

projects:
  root:
    description: >-
      ZigbeeControl monorepo — orchestration tooling (the suite runner behind
      `uv run run-suite`), the shared Procfile.dev dev stack, and CI.
    # The build/validation/deploy job. `AaC/ZigbeeControl` (Jenkinsfile.architecture)
    # is the repo's second job and validates the docs/architecture/*.yaml producers.
    jenkins: ZigbeeControl
    setup: cexec modern-app uv sync --locked
    # No test: the root project is honcho plus the suite runner and ships no suite.
    # The root's own Python, and the architecture models; the components lint
    # themselves.
    lint:
      # The rule set and the Ruff version are pinned in the root pyproject.toml.
      - cexec modern-app uv run ruff check scripts tools
      # The two models AaC/ZigbeeControl validates (Jenkinsfile.architecture), the
      # backend's and the frontend's; arch-validate submits each file on its own.
      # It exits 0 valid, 1 invalid, 2 transport: a 2 is the architecture
      # service, not this repository.
      - "if ls backend/docs/architecture/*.yaml frontend/docs/architecture/*.yaml >/dev/null 2>&1; then cexec aac-tools arch-validate backend/docs/architecture/*.yaml frontend/docs/architecture/*.yaml; else echo 'No architecture model in backend/docs/architecture/ and frontend/docs/architecture/'; fi"

  backend:
    description: >-
      Flask backend for the Zigbee2MQTT multi-instance control panel — serves tab
      configuration, triggers Kubernetes rollout restarts for restartable tabs, and
      streams live deployment status to the UI over SSE.
    setup:
      - cexec modern-app uv sync --locked
      # `.env` is gitignored, so a fresh clone has none — and outside FLASK_ENV=testing
      # the app will not start without APP_TABS_CONFIG (app/app_config.py raises when
      # the tabs file is missing). Seed the checked-in sample tabs config, which is
      # what frontend/.env.example already points development at. An existing .env is
      # left untouched.
      - test -f .env || printf 'APP_TABS_CONFIG=test/tabs.yaml\n' > .env
    test: cexec modern-app uv run pytest
    # `uv run check` also runs pytest; lint calls the checkers directly so
    # linting and testing stay separate gates.
    lint:
      - cexec modern-app uv run ruff check .
      - cexec modern-app uv run mypy .
      - cexec modern-app uv run vulture app/ vulture_whitelist.py --min-confidence 80

  frontend:
    description: >-
      React 19 + TanStack Router/Query SPA wrapping the Zigbee2MQTT and Code Server
      web UIs, with a generated OpenAPI client; Playwright E2E suite that boots the
      backend per worker.
    setup:
      - cexec modern-app pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - cexec modern-app pnpm playwright install chromium
      # Same story as the backend: gitignored, and without APP_TABS_CONFIG the Vite
      # dev server publishes no iframe proxies for the wrapped tabs.
      - test -f .env || printf 'APP_TABS_CONFIG=../backend/test/tabs.yaml\n' > .env
    build: cexec modern-app pnpm build
    test: cexec modern-app pnpm playwright test
    lint: cexec modern-app pnpm check
