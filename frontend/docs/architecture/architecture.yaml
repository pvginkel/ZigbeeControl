schemaVersion: "0.1"
producer: zigbee-control

# Single-page web UI for the Zigbee2MQTT multi-instance control panel (Z2M
# Wrapper). A React/Vite SPA served as static assets by nginx; it consumes the
# Zigbee Control backend API and subscribes to the in-house SSE gateway for live
# tab status. Its primary purpose is to WRAP three other web UIs deployed
# alongside it by the zigbee2mqtt helm chart — two Zigbee2MQTT instances
# (zigbee2mqtt1, zigbee2mqtt2) and a Code Server — adding minimal control
# function. Those three are upstream products deployed by helm-charts; modeled
# here as the external services this UI wraps (candidates to move to the deployer
# / base set later). This artifact is the frontend/ half of the ZigbeeControl
# monorepo and declares the same zigbee-control producer as the backend
# artifact under backend/, since one repo publishes one producer. The YAML
# here is hand-authored and is the source of truth.

applicationComponents:
  - id: app:zigbee-control-ui,880df297-2b73-4198-8f92-028d84118be9
    label: Zigbee Control UI
    summary: >-
      React/Vite single-page web UI for the Zigbee2MQTT control panel. Renders
      the tab shell, triggers Kubernetes rollout restarts via the backend, and
      reflects live deployment status streamed from the SSE gateway.
    introduced: 2025-09-27
    lifecycle: active
    stereotype: SoftwareProduct
    sourceRepository: git:pvginkel/ZigbeeControl
    stats:
      image: registry:5000/zigbee-control-ui

applicationServices:
  - id: svc:zigbee-control-ui-web,13c8cfe4-27ab-47fb-bae7-035d08176913
    label: Zigbee Control UI web app
    summary: >-
      The single-page web application served over HTTP to browsers: the tab
      shell, auth gate, and restart/status controls of the control panel.
    introduced: 2025-09-27
    lifecycle: active

  # The three web UIs this app wraps (upstream products deployed by the
  # zigbee2mqtt helm chart). Declared here as the surfaces this UI fronts.
  - id: svc:zigbee2mqtt1-web,941b28d4-b43a-472a-b45a-a1fb9ecb7cf2
    label: Zigbee2MQTT 1 web frontend
    summary: The Zigbee2MQTT web frontend of the first Z2M instance, wrapped as a tab by the control UI.
    introduced: 2025-09-27
    lifecycle: active

  - id: svc:zigbee2mqtt2-web,1e695264-e611-44c7-b468-3e18fba4f6b3
    label: Zigbee2MQTT 2 web frontend
    summary: The Zigbee2MQTT web frontend of the second Z2M instance, wrapped as a tab by the control UI.
    introduced: 2025-09-27
    lifecycle: active

  - id: svc:code-server-web,6caab656-c41c-4586-b92c-660d6f476735
    label: Code Server web UI
    summary: The code-server browser IDE deployed alongside Z2M for editing configuration, wrapped as a tab by the control UI.
    introduced: 2025-09-27
    lifecycle: active

applicationInterfaces:
  - id: if:zigbee-control-ui-browser,23738d07-7368-494a-a643-d7c71557212d
    label: Zigbee Control UI (browser)
    summary: >-
      Surface consumed by end users' browsers (loaded directly and iframe-embedded
      by the webathome.org portal): the served SPA bundle and its entry document.
    introduced: 2025-09-27
    lifecycle: active

relations:
  # The product realizes the web UI service it serves to browsers.
  - id: rel:zigbee-control-ui-realizes-web
    source: app:zigbee-control-ui,880df297-2b73-4198-8f92-028d84118be9
    target: svc:zigbee-control-ui-web,13c8cfe4-27ab-47fb-bae7-035d08176913
    type: Realization

  # One interface per distinct consumer class; the web UI has a single consumer —
  # the end-user browser.
  - id: rel:browser-interface-on-web
    source: if:zigbee-control-ui-browser,23738d07-7368-494a-a643-d7c71557212d
    target: svc:zigbee-control-ui-web,13c8cfe4-27ab-47fb-bae7-035d08176913
    type: Assignment

  # Frontend -> backend: the SPA consumes the Zigbee Control backend API
  # (resolved from the backend artifact of the same zigbee-control producer).
  # Reached via the same-origin relative path /api/ proxied by the frontend
  # half's nginx — no env var, so no boundBy.
  - id: rel:zigbee-control-ui-consumes-api
    source: app:zigbee-control-ui,880df297-2b73-4198-8f92-028d84118be9
    target: svc:zigbee-control-api,ce8d7938-5d7d-4eee-abab-294cf19315e7
    type: Association

  # Frontend -> SSE gateway: the SPA subscribes to the in-house SSE gateway's
  # browser client stream (/api/sse/stream) for live tab status. Reached via the
  # same-origin relative path proxied by the frontend half's nginx to the
  # gateway sidecar — no env var, so no boundBy. Cross-producer svc from the
  # ssegateway artifact.
  - id: rel:zigbee-control-ui-consumes-sse-gateway
    source: app:zigbee-control-ui,880df297-2b73-4198-8f92-028d84118be9
    target: svc:ssegateway,59a7d043-bb0c-4e44-a8b8-3e943338f807
    type: Association

  # The app wraps the three sibling web UIs (two Z2M instances + code-server),
  # embedding each as a tab. These are the load-bearing edges that make the
  # wrapping explicit.
  - id: rel:z2m1-serves-zigbee-control-ui
    source: svc:zigbee2mqtt1-web,941b28d4-b43a-472a-b45a-a1fb9ecb7cf2
    target: app:zigbee-control-ui,880df297-2b73-4198-8f92-028d84118be9
    type: Serving

  - id: rel:z2m2-serves-zigbee-control-ui
    source: svc:zigbee2mqtt2-web,1e695264-e611-44c7-b468-3e18fba4f6b3
    target: app:zigbee-control-ui,880df297-2b73-4198-8f92-028d84118be9
    type: Serving

  - id: rel:code-server-serves-zigbee-control-ui
    source: svc:code-server-web,6caab656-c41c-4586-b92c-660d6f476735
    target: app:zigbee-control-ui,880df297-2b73-4198-8f92-028d84118be9
    type: Serving
