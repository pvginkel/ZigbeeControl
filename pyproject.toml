[tool.poetry]
name = "zigbee-control"
version = "0.1.0"
description = "Zigbee2MQTT multi-instance control panel — monorepo orchestration tooling"
authors = ["Pieter van Ginkel <pvginkel@gmail.com>"]
packages = [{include = "tools"}]

[tool.poetry.dependencies]
python = "^3.13"
pathspec = "^1"
honcho = "^2"
psutil = "^5"

[tool.poetry.scripts]
run-suite = "tools.suite_runner.local:cli"

[tool.poetry.group.dev.dependencies]
pytest = "^8"
ruff = "0.11.13"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# Pinned to the same rule set backend/pyproject.toml declares, so the root's gate
# does not float with whatever Ruff defaults the toolchain image happens to ship.
[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ERA",   # eradicate (commented-out code)
    "RUF100", # unused noqa directives
]
ignore = [
    "E501", # line too long
    "B008", # do not perform function calls in argument defaults
    "W191", # indentation contains tabs
]
