[tool.poetry]
name = "zigbee-control"
version = "0.1.0"
description = "Zigbee2MQTT multi-instance control panel — monorepo orchestration tooling"
authors = ["Pieter van Ginkel <pvginkel@gmail.com>"]
packages = [{include = "tools"}]

[tool.poetry.dependencies]
python = "^3.13"
pathspec = "^1"
honcho = "^2"
psutil = "^5"

[tool.poetry.scripts]
run-suite = "tools.suite_runner.local:cli"

[tool.poetry.group.dev.dependencies]
pytest = "^8"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
